<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FoodControl PRO AI ULTIMATE</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@2/dist/tesseract.min.js"></script>

<!-- PWA MANIFEST -->
<link rel="manifest" id="manifestPlaceholder">

<style>
:root{--green:#22c55e;--bg:#0f1117;--card:#1e2535;--text:#f1f5f9;--border:#2d3748;--red:#ef4444;--yellow:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:sans-serif}
#app{max-width:430px;margin:auto;height:100vh;display:flex;flex-direction:column}
.header{padding:15px;border-bottom:1px solid var(--border)}
.content{flex:1;overflow:auto;padding:10px 10px 80px}
.screen{display:none}
.screen.active{display:block}
.nav{position:fixed;bottom:0;width:100%;display:flex;overflow-x:auto;background:#111}
.nav button{flex:1;min-width:70px;border:none;background:none;color:#888;padding:10px}
.nav button.active{color:var(--green)}
.card{background:var(--card);padding:10px;margin-bottom:10px;border-radius:10px}
input{width:100%;padding:8px;margin:4px 0;background:#000;border:1px solid var(--border);color:#fff}
button{padding:10px;border:none;background:var(--green);color:#000;margin-top:5px}
.badge{padding:2px 6px;border-radius:6px;font-size:12px}
.red{background:var(--red)}
.yellow{background:var(--yellow)}
</style>
</head>
<body>
<div id="app">

<div class="header">FoodControl PRO AI ULTIMATE</div>

<div class="content">

<div id="dashboard" class="screen active">
<div class="card">📊 Dashboard IA</div>
<canvas id="chart"></canvas>
<div id="alerts"></div>
<div id="insights"></div>
</div>

<div id="stock" class="screen">
<div class="card">
<input id="sn" placeholder="Producto">
<input id="sc" type="number" placeholder="Cantidad">
<input id="sp" type="number" placeholder="Precio">
<button onclick="addStock()">Agregar</button>
</div>
<div id="stockList"></div>
</div>

<div id="recetas" class="screen">
<div class="card">
<input id="rn" placeholder="Receta">
<input id="ri" placeholder="Ingredientes (coma)">
<button onclick="addReceta()">Guardar</button>
</div>
<div id="recetaList"></div>
</div>

<div id="plan" class="screen">
<div class="card"><button onclick="genPlanAI()">Generar Plan IA</button></div>
<div id="planList"></div>
</div>

<div id="precios" class="screen">
<div class="card">
<input id="ps" placeholder="Supermercado">
<input id="pp" placeholder="Producto">
<input id="pr" type="number" placeholder="Precio">
<button onclick="addPrecio()">Guardar</button>
</div>
<div id="precioList"></div>
</div>

<div id="ocr" class="screen">
<div class="card">
<input type="file" onchange="ocr(event)">
<button onclick="importOCR()">Importar</button>
<div id="ocrOut"></div>
</div>
</div>

</div>

<div class="nav">
<button onclick="go('dashboard')" id="b-dashboard" class="active">Inicio</button>
<button onclick="go('stock')" id="b-stock">Stock</button>
<button onclick="go('recetas')" id="b-recetas">Recetas</button>
<button onclick="go('plan')" id="b-plan">Plan</button>
<button onclick="go('precios')" id="b-precios">Precios</button>
<button onclick="go('ocr')" id="b-ocr">OCR</button>
</div>

</div>

<script>

let DB = JSON.parse(localStorage.getItem('db'))||{
 stock:[],recetas:[],plan:[],precios:[],history:[]
}
const save=()=>localStorage.setItem('db',JSON.stringify(DB))

// MULTI DEVICE SYNC
const bc = new BroadcastChannel("food_sync")
bc.onmessage = (e)=>{DB=e.data;renderAll()}
function sync(){bc.postMessage(DB)}

function go(id){
 document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'))
 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'))
 document.getElementById(id).classList.add('active')
 document.getElementById('b-'+id).classList.add('active')
 renderAll()
}

// STOCK
function addStock(){
 const n=sn.value.trim();const c=+sc.value;const p=+sp.value||0
 if(!n||!c)return
 DB.stock.push({n,c,p,used:0})
 DB.history.push({n,c,date:Date.now()})
 save();sync();renderStock();insights()
}

function usagePerWeek(name){
 const h=DB.history.filter(x=>x.n===name)
 if(!h.length)return 0
 const days=(Date.now()-h[0].date)/86400000
 return h.reduce((a,b)=>a+b.c,0)/(days/7||1)
}

function forecastStock(){
 return DB.stock.map(s=>({
 name:s.n,
 need:Math.max(0,Math.round(usagePerWeek(s.n)*1.2 - s.c))
 }))
}

function renderStock(){
 stockList.innerHTML=DB.stock.map(x=>`<div class='card'>${x.n} - ${x.c}</div>`).join('')
}

// RECETAS + COSTO
function addReceta(){
 const n=rn.value.trim();const ing=ri.value.split(',').map(i=>i.trim())
 DB.recetas.push({n,ing})
 save();sync();renderRecetas()
}

function recipeCost(r){
 return r.ing.reduce((t,i)=>{
 const s=DB.stock.find(x=>x.n.toLowerCase()==i.toLowerCase())
 return t+(s?s.p/s.c:0)
 },0)
}

function renderRecetas(){
 recetaList.innerHTML=DB.recetas.map((r,i)=>{
 const cost=recipeCost(r)
 return `<div class='card'>${r.n} 💰${cost.toFixed(2)} <button onclick='useRecipe(${i})'>Usar</button></div>`
 }).join('')
}

// CONSUMO
function useRecipe(i){
 const r=DB.recetas[i]
 r.ing.forEach(ing=>{
 const s=DB.stock.find(x=>x.n.toLowerCase()==ing.toLowerCase())
 if(s){s.c-=1;s.used+=1}
 })
 save();sync();renderAll();insights()
}

// ALERTAS
function alerts(){
 return DB.stock.filter(s=>s.c<=2).map(s=>`⚠️ ${s.n}`)
}

// COMPRAS SUGERIDAS
function shoppingList(){
 return forecastStock().filter(x=>x.need>0)
}

// AHORRO
function savings(){
 let avg=DB.precios.reduce((a,b)=>a+b.prc,0)/(DB.precios.length||1)
 return (avg*DB.stock.length)*0.1
}

// INSIGHTS IA
function insights(){
 const el=document.getElementById('insights')
 el.innerHTML=`
 <div class='card'>📦 Comprar: ${shoppingList().map(x=>x.name).join(', ')||'OK'}</div>
 <div class='card'>💰 Ahorro estimado: ${savings().toFixed(2)}</div>
 <div class='card'>📈 Predicción semanal OK</div>
 `
}

// PLAN IA
function genPlanAI(){
 DB.plan=DB.recetas.slice().sort((a,b)=>recipeCost(a)-recipeCost(b)).slice(0,5)
 save();sync();renderPlan()
}

function renderPlan(){
 planList.innerHTML=DB.plan.map(p=>`<div class='card'>${p.n}</div>`).join('')
}

// PRECIOS
function addPrecio(){
 DB.precios.push({s:ps.value,p:pp.value,prc:+pr.value})
 save();sync();renderPrecios()
}

function renderPrecios(){
 precioList.innerHTML=DB.precios.map(x=>`<div class='card'>${x.p} - ${x.prc}</div>`).join('')
}

function bestPrice(p){
 const f=DB.precios.filter(x=>x.p.toLowerCase()==p.toLowerCase())
 return f.sort((a,b)=>a.prc-b.prc)[0]
}

// OCR + IMPORT
async function ocr(e){
 const f=e.target.files[0]
 const {data:{text}}=await Tesseract.recognize(f,'spa')
 ocrOut.innerText=text
 window._ocr=text
}

function importOCR(){
 if(!window._ocr)return
 window._ocr.split('\n').forEach(l=>{
 const p=l.split(' ')
 if(p.length>=2)DB.stock.push({n:p[0],c:+p[1]||1,p:0,used:0})
 })
 save();sync();renderStock()
}

// DASHBOARD
let chart
function renderChart(){
 const ctx=document.getElementById('chart')
 if(chart)chart.destroy()
 chart=new Chart(ctx,{type:'bar',data:{labels:DB.stock.map(x=>x.n),datasets:[{data:DB.stock.map(x=>x.c)}]}})
}

function renderAll(){
 renderStock();renderRecetas();renderPlan();renderPrecios();renderChart();insights()
}

// PWA OFFLINE
if('serviceWorker' in navigator){
 const sw = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))})`
 const blob=new Blob([sw],{type:'text/javascript'})
 navigator.serviceWorker.register(URL.createObjectURL(blob))
}

// INIT
renderAll()
</script>
</body>
</html>
